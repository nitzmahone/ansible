- name: Make sure that test with name that isn't a valid Ansible plugin name does not result in a crash (1/2)
  set_fact:
    foo: '{{ [{"failed": false}] | selectattr("failed", "==", true) }}'

- name: Make sure that test with name that isn't a valid Ansible plugin name does not result in a crash (2/2)
  template:
    src: invalid_test_name.j2
    dest: /tmp/foo
  ignore_errors: true
  register: result

- assert:
    that:
      - result is failed
      - >-
        "TemplateSyntaxError: Could not load \"asdf \": 'invalid plugin name: ansible.builtin.asdf '" in result.msg

- name: Make sure syntax errors originating from a template being compiled into Python code object result in a failure
  debug:
    msg: "{{ lookup('vars', 'v1', default='', default='') }}"
  ignore_errors: true
  register: r

- assert:
    that:
      - r is failed
      - "'keyword argument repeated' in r.msg"

- name: ensure nested indirect templating is lazy (only recurse to render containers with templated when one is leaving the template system)
  vars:
    tripwire_file: "{{ output_dir ~ '/bang' }}"
    top_level: '{{ intermediate }}'
    intermediate: '{{ lowest }}'
    lowest:
      key1: static data
      key2:
        subdict2:
          unused_value_with_tripwire: '{{ lookup("pipe", "touch " ~ output_dir ~ "/bang") }}'
  block:
    - name: ensure tripwire file is missing
      raw: rm -f {{ tripwire_file }}

    - name: manipulate a var with nested indirected templates and ensure that only the areas we access are templated
      set_fact:
        am_i_lazy: '{{ top_level.key1 }}'

    - name: check presence of tripwire
      stat:
        path: '{{ tripwire_file }}'
      register: stat_res

    - assert:
        that:
        - am_i_lazy == "static data"
        - not stat_res.stat.exists
