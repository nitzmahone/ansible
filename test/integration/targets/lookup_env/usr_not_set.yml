- hosts: testhost
  gather_facts: no
  tasks:
    - name: look up an environment variable which is not set with various default behaviors
      debug:
        msg:
          - "{{ lookup('env', 'USR') == '' }}"  # expect '' (the default fallback value)
          - "{{ lookup('env', 'USR', default='nobody') == 'nobody' }}"  # expect 'nobody'
          - "{{ lookup('env', 'USR', default=undef()) }}"  # expect an undef() generated by the env lookup
          - "{{ lookup('env', 'USR', default=undef('custom')) }}"  #  expect a custom undef
          - "{{ lookup('env', 'USR', default=bogus_var) }}"  #  expect an undef for bogus_var
      register: result

    - name: verify the lookups returned the expected results
      assert:
        that:
          - result.msg[2] == "<< error 1 - The environment variable 'USR' is not set. >>"
          - result.msg[3] == "<< error 2 - custom >>"
          - result.msg[4] == "<< error 3 - 'bogus_var' is undefined >>"
